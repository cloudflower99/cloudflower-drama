</style></head><body><header><div class="wrap nav"><a class="brand" href="./">☁️ <span>在云的背面种花</span></a><div class="nav-actions"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换日夜模式">🌙 夜间</button><a class="navlink" href="./">← 剧集目录</a></div></div></header><main class="wrap review-page"><a class="back" href="./">← 返回剧集目录</a><p class="eyebrow">COMMUNITY REVIEWS</p><h1>剧集评价 💬</h1><p class="lead">看过之后，聊聊感受。欢迎友善交流，涉及关键剧情时请先提醒其他人。</p><div class="review-layout"><section aria-labelledby="list-title"><div class="section-title"><h2 id="list-title">💬 观众短评</h2><span id="count" aria-live="polite">正在加载…</span></div><label class="sr-only" for="filter">按剧名搜索评价</label><input class="control review-filter" type="search" id="filter" placeholder="搜索剧名或评价内容"><div id="list" class="review-list" aria-live="polite"></div><p id="message" class="empty" hidden></p><button type="button" class="showmore" id="retry-reviews" hidden>重试加载评价</button><button class="showmore" id="more" hidden>加载更多</button></section><section class="panel review-form" aria-labelledby="form-title"><h2 id="form-title">✍️ 写一条评价</h2><p>选择剧集并留下你的感受，评价将匿名显示。</p><form id="form"><label class="field" for="drama">剧集</label><div class="drama-combo"><input class="control" id="drama" type="text" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="drama-options" autocomplete="off" placeholder="搜索或选择剧集" required disabled><button class="combo-toggle" id="drama-toggle" type="button" aria-label="展开剧集列表" tabindex="-1" disabled><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="combo-menu" id="drama-menu" hidden><div id="drama-options" role="listbox" aria-label="剧集列表"></div><div class="combo-hint" id="drama-hint" aria-live="polite"></div></div></div><fieldset class="star-field"><legend>评分</legend><div class="star-picker" role="radiogroup" aria-label="评分"><label class="star-choice" title="1 星 · 不推荐"><input type="radio" name="rating" value="1" aria-label="1 星，不推荐" required><span aria-hidden="true">☆</span></label><label class="star-choice" title="2 星 · 有点失望"><input type="radio" name="rating" value="2" aria-label="2 星，有点失望" required><span aria-hidden="true">☆</span></label><label class="star-choice" title="3 星 · 一般"><input type="radio" name="rating" value="3" aria-label="3 星，一般" required><span aria-hidden="true">☆</span></label><label class="star-choice" title="4 星 · 不错"><input type="radio" name="rating" value="4" aria-label="4 星，不错" required><span aria-hidden="true">☆</span></label><label class="star-choice" title="5 星 · 超好看"><input type="radio" name="rating" value="5" aria-label="5 星，超好看" required><span aria-hidden="true">☆</span></label><span class="star-caption" id="star-caption" aria-live="polite">请选择评分</span></div></fieldset><label class="field" for="content">你的评价</label><textarea class="control" id="content" maxlength="1800" required placeholder="分享你的真实感受…"></textarea><div class="cf-turnstile" data-sitekey="0x4AAAAAAGEaNcQkvjwX23p5"></div><button class="submit" id="submit" type="submit" disabled>提交评价</button><p id="status" class="status" role="status"></p></form></section></div></main><footer><div class="wrap">☁️ 在云的背面种花</div></footer><script>
'use strict';const API='https://api.cloudofflower.ccwu.cc', $=s=>document.querySelector(s);let rows=[],pending=new Map(),limit=20,hasCachedReviews=false;
// Keep the last successful public snapshot for offline fallback. Its revision
// travels with the snapshot so quota failures cannot mark old data as current.
const cacheObject=key=>{try{const x=JSON.parse(localStorage.getItem('cloudflower-'+key+'-v1'));return x&&Number.isFinite(x.at)&&x.at<=Date.now()+60000&&Array.isArray(x.value)?x:null}catch{return null}};
const cacheRead=key=>cacheObject(key)?.value||null;
const cacheWrite=(key,value,revision=null)=>{try{localStorage.setItem('cloudflower-'+key+'-v1',JSON.stringify({at:Date.now(),value,revision}));return true}catch{return false}};
async function readJSON(path){
 for(let attempt=0;attempt<2;attempt++){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
  try{const r=await fetch('https://api.cloudofflower.ccwu.cc/'+path,{signal:controller.signal});if(!r.ok){const e=Error('HTTP '+r.status);e.noRetry=r.status<500;throw e}return await r.json()}
  catch(e){if(attempt||e.noRetry)throw e;await new Promise(resolve=>setTimeout(resolve,1000))}
  finally{clearTimeout(timer)}
 }
}
const cachedReviews=cacheRead('reviews'),cachedOptions=cacheRead('options');
let cacheState='',reviewRevision=null,loadPending=false;reviewRevision=cacheObject('reviews')?.revision??null;
let dramaNames=[],initialDramaApplied=false,comboMatches=[],comboActive=-1,editedDrama=false;
const dramaInput=$('#drama'),dramaMenu=$('#drama-menu'),dramaList=$('#drama-options'),dramaHint=$('#drama-hint');
function validateDrama(){let v=dramaInput.value.trim();dramaInput.setCustomValidity(v&&!dramaNames.includes(v)?'请从列表选择剧集':'')}
function closeDrama(){dramaMenu.hidden=true;dramaInput.setAttribute('aria-expanded','false');dramaInput.removeAttribute('aria-activedescendant');comboActive=-1}
function chooseDrama(name){dramaInput.value=name;editedDrama=true;validateDrama();closeDrama();dramaInput.focus()}
function highlightDrama(){let options=dramaList.querySelectorAll('[role=option]');options.forEach((el,i)=>{el.classList.toggle('active',i===comboActive);el.setAttribute('aria-selected',i===comboActive?'true':'false')});if(comboActive>=0&&options[comboActive]){dramaInput.setAttribute('aria-activedescendant',options[comboActive].id);options[comboActive].scrollIntoView({block:'nearest'})}else dramaInput.removeAttribute('aria-activedescendant')}
function openDrama(showAll=false){
  if(!dramaNames.length)return;let term=showAll?'':dramaInput.value.trim().normalize('NFKC').toLocaleLowerCase();
  comboMatches=dramaNames.filter(n=>n!=='其他'&&n.normalize('NFKC').toLocaleLowerCase().includes(term)).slice(0,80);comboActive=-1;dramaList.replaceChildren();
  comboMatches.forEach((name,i)=>{let option=document.createElement('button');option.type='button';option.className='combo-option';option.id='drama-option-'+i;option.setAttribute('role','option');option.setAttribute('aria-selected','false');option.textContent=name;option.addEventListener('mousedown',e=>e.preventDefault());option.addEventListener('click',()=>chooseDrama(name));dramaList.append(option)});
  dramaHint.textContent=comboMatches.length===0?'没有找到匹配的剧集':comboMatches.length===80?'输入剧名可缩小范围':'';dramaMenu.hidden=false;dramaInput.setAttribute('aria-expanded','true');dramaInput.removeAttribute('aria-activedescendant');
}
function fillOptions(names){dramaNames=names;if(!initialDramaApplied&&!editedDrama){let requested=new URLSearchParams(location.search).get('drama');if(requested&&names.includes(requested))dramaInput.value=requested;initialDramaApplied=!requested||names.includes(requested)}else if(editedDrama)initialDramaApplied=true;dramaInput.disabled=false;$('#drama-toggle').disabled=false;$('#submit').disabled=false;validateDrama();if(!dramaMenu.hidden)openDrama()}
dramaInput.addEventListener('input',()=>{editedDrama=true;validateDrama();openDrama()});
dramaInput.addEventListener('focus',()=>{if(!dramaInput.value)openDrama(true)});
dramaInput.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrama();return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(dramaMenu.hidden)openDrama(true);if(comboMatches.length){comboActive=comboActive<0?(e.key==='ArrowDown'?0:comboMatches.length-1):(comboActive+(e.key==='ArrowDown'?1:-1)+comboMatches.length)%comboMatches.length;highlightDrama()}return}if(e.key==='Enter'&&!dramaMenu.hidden&&comboActive>=0){e.preventDefault();chooseDrama(comboMatches[comboActive])}});
$('#drama-toggle').addEventListener('click',()=>{if(!dramaMenu.hidden)closeDrama();else{dramaInput.focus();openDrama(true)}});
document.addEventListener('click',e=>{if(!e.target.closest('.drama-combo'))closeDrama()});
function updateStars(){let selected=Number(document.querySelector('input[name="rating"]:checked')?.value||0),labels=['','不推荐','有点失望','一般','不错','超好看'];document.querySelectorAll('.star-choice').forEach(el=>{let active=Number(el.querySelector('input').value)<=selected;el.classList.toggle('active',active);el.querySelector('span').textContent=active?'★':'☆'});$('#star-caption').textContent=selected?selected+' 星 · '+labels[selected]:'请选择评分'}
document.querySelectorAll('input[name="rating"]').forEach(el=>el.addEventListener('change',updateStars));
const norm=s=>(s||'').toLocaleLowerCase().normalize('NFKC');function render(){const term=norm($('#filter').value.trim()),data=rows.filter(x=>!term||norm(x.drama+' '+x.content).includes(term));$('#count').textContent=data.length+' 条评价'+(cacheState?' · '+cacheState:'');$('#list').replaceChildren();for(const x of data.slice(0,limit)){let card=document.createElement('article');card.className='review-card';let title=document.createElement('h3');title.textContent=x.drama||'未注明剧集';let meta=document.createElement('div');meta.className='meta';let star=document.createElement('span');star.className='stars';star.textContent=x.rating?'★'.repeat(x.rating)+'☆'.repeat(5-x.rating):'未评分';let who=document.createElement('span');who.textContent=x.author||'匿名观众';let time=document.createElement('time');if(x.time){time.dateTime=x.time;time.textContent=new Date(x.time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}meta.append(star,who,time);let p=document.createElement('p');p.className='review-content';p.textContent=x.content;card.append(title,meta,p);if(x.id)card.append(CloudLikes.button('review',x.id));$('#list').append(card)}$('#message').hidden=data.length>0;$('#message').textContent='暂时没有找到评价。';$('#more').hidden=data.length<=limit}async function load(){
  if(loadPending)return;loadPending=true;
  try{
    let state=null;try{state=await readJSON('version')}catch{}
    if(state?.ready&&hasCachedReviews&&!pending.size&&reviewRevision===String(state.revision)){cacheState=state.stale?'Notion 同步暂时受限':'';$('#retry-reviews').hidden=!state.stale;render();return}
    let data=await readJSON('reviews');if(!Array.isArray(data.reviews))throw Error();
    for(const x of data.reviews)pending.delete(x.id);rows=[...pending.values(),...data.reviews];hasCachedReviews=true;
    reviewRevision=data.ready?String(data.revision):null;cacheWrite('reviews',data.reviews,reviewRevision);
    cacheState=data.stale||!data.ready?'Notion 同步暂时受限':'';$('#retry-reviews').hidden=!(data.stale||!data.ready);render();
  }catch{$('#retry-reviews').hidden=false;if(hasCachedReviews||pending.size){cacheState='缓存，更新暂不可用';render()}else{$('#count').textContent='加载失败';$('#message').hidden=false;$('#message').textContent='评价暂时无法加载，请稍后刷新重试。'}}finally{loadPending=false}
}let optionsLoadedOK=false,optionsLoading=false;async function loadOptions(){if(optionsLoading)return;optionsLoading=true;try{let data=await readJSON('options');if(!Array.isArray(data.options))throw Error();cacheWrite('options',data.options);fillOptions(data.options);optionsLoadedOK=true;if($('#status').textContent==='剧集列表暂时无法加载，正在重试。')$('#status').textContent=''}catch{if(!cachedOptions)$('#status').textContent='剧集列表暂时无法加载，正在重试。'}finally{optionsLoading=false}}$('#retry-reviews').addEventListener('click',()=>{load();if(!optionsLoadedOK)loadOptions()});$('#filter').addEventListener('input',()=>{limit=20;render()});$('#more').addEventListener('click',()=>{limit+=20;render()});$('#form').addEventListener('submit',async e=>{e.preventDefault();let token=window.turnstile?.getResponse();if(!token){$('#status').textContent='请先完成人机验证。';return}$('#submit').disabled=true;$('#status').textContent='正在提交…';try{let res=await fetch(API+'/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({drama:$('#drama').value,rating:Number(document.querySelector('input[name="rating"]:checked')?.value||0),content:$('#content').value,token})});let data=await res.json();if(!res.ok)throw Error(data.error||'提交失败');pending.set(data.review.id,data.review);rows=[data.review,...rows.filter(x=>x.id!==data.review.id)];render();$('#content').value='';document.querySelectorAll('input[name="rating"]').forEach(el=>el.checked=false);updateStars();$('#status').textContent='提交成功，感谢分享！';await load()}catch(err){$('#status').textContent=err.message||'提交失败，请稍后重试。'}finally{window.turnstile?.reset();$('#submit').disabled=false}});if(cachedReviews){rows=cachedReviews;hasCachedReviews=true;cacheState='缓存，正在更新';render()}if(cachedOptions)fillOptions(cachedOptions);loadOptions();load();setInterval(()=>{if(!document.hidden){load();if(!optionsLoadedOK)loadOptions()}},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();if(!optionsLoadedOK)loadOptions()}});window.addEventListener('online',()=>{load();if(!optionsLoadedOK)loadOptions()});
</script></body></html>
