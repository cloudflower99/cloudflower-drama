<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="description" content="分享你的剧集短评"><title>剧集评价 · 在云的背面种花</title><link rel="stylesheet" href="style.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><style>
.review-page{padding-top:44px;padding-bottom:80px}.back{color:var(--accent);text-decoration:none;display:inline-block;padding:8px 0;margin-bottom:22px}.review-page h1{font-size:clamp(32px,5vw,44px)}.lead{color:var(--muted);margin:14px 0 30px}.review-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}.panel h2,.section-title h2{font-size:21px;margin:0}.panel p{margin:8px 0 20px;color:var(--muted);font-size:14px}.field{display:block;font-weight:650;font-size:15px;margin:18px 0 6px}.control{display:block;width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:10px 12px;font:inherit}.control:focus{outline:2px solid #2783de;outline-offset:2px}textarea.control{resize:vertical;min-height:130px;line-height:1.6}.submit{background:#215d8e;color:white;border:0;border-radius:8px;font-weight:650;min-height:46px;padding:10px 20px}.submit:disabled{opacity:.55;cursor:not-allowed}.cf-turnstile{margin:18px 0}.status{font-size:14px;color:var(--muted);min-height:1.5em;margin:12px 0 0!important}.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.section-title span{color:var(--muted);font-size:14px}.review-filter{margin-bottom:14px}.review-list{display:grid;gap:12px}.review-card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:20px}.review-card h3{font-size:16px;line-height:1.5;margin:0 0 8px;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:14px}.stars{color:#a56a0a;letter-spacing:1px}.review-content{margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.empty{color:var(--muted);padding:24px 0}.showmore{margin-top:16px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:8px 16px}.review-form{position:sticky;top:20px}@media(max-width:800px){.review-layout{grid-template-columns:1fr}.review-form{position:static;grid-row:1}.review-page{padding-top:28px}.panel{padding:20px}}@media(prefers-color-scheme:dark){.stars{color:#eac26b}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="./">☁️ <span>在云的背面种花</span></a><a class="navlink" href="./">← 剧集目录</a></div></header><main class="wrap review-page"><a class="back" href="./">← 返回剧集目录</a><p class="eyebrow">COMMUNITY REVIEWS</p><h1>剧集评价 💬</h1><p class="lead">看过之后，聊聊感受。欢迎友善交流，涉及关键剧情时请先提醒其他人。</p><div class="review-layout"><section aria-labelledby="list-title"><div class="section-title"><h2 id="list-title">💬 观众短评</h2><span id="count" aria-live="polite">正在加载…</span></div><label class="sr-only" for="filter">按剧名搜索评价</label><input class="control review-filter" type="search" id="filter" placeholder="搜索剧名或评价内容"><div id="list" class="review-list" aria-live="polite"></div><p id="message" class="empty" hidden></p><button class="showmore" id="more" hidden>加载更多</button></section><section class="panel review-form" aria-labelledby="form-title"><h2 id="form-title">✍️ 写一条评价</h2><p>选择剧集并留下你的感受，评价将匿名显示。</p><form id="form"><label class="field" for="drama">剧集</label><select class="control" id="drama" required disabled><option value="">正在加载剧集…</option></select><label class="field" for="rating">评分</label><select class="control" id="rating" required><option value="">请选择评分</option><option value="5">⭐⭐⭐⭐⭐ 超好看</option><option value="4">⭐⭐⭐⭐ 不错</option><option value="3">⭐⭐⭐ 一般</option><option value="2">⭐⭐ 有点失望</option><option value="1">⭐ 不推荐</option></select><label class="field" for="content">你的评价</label><textarea class="control" id="content" maxlength="1800" required placeholder="分享你的真实感受…"></textarea><div class="cf-turnstile" data-sitekey="0x4AAAAAAGEaNcQkvjwX23p5"></div><button class="submit" id="submit" type="submit" disabled>提交评价</button><p id="status" class="status" role="status"></p></form></section></div></main><footer><div class="wrap">☁️ 在云的背面种花</div></footer><script>
'use strict';const API='https://cloudflower-reviews.lilyanna-sanders-e5d.workers.dev', $=s=>document.querySelector(s);let rows=[],pending=new Map(),limit=20;const norm=s=>(s||'').toLocaleLowerCase().normalize('NFKC');function render(){const term=norm($('#filter').value.trim()),data=rows.filter(x=>!term||norm(x.drama+' '+x.content).includes(term));$('#count').textContent=data.length+' 条评价';$('#list').replaceChildren();for(const x of data.slice(0,limit)){let card=document.createElement('article');card.className='review-card';let title=document.createElement('h3');title.textContent=x.drama||'未注明剧集';let meta=document.createElement('div');meta.className='meta';let star=document.createElement('span');star.className='stars';star.textContent=x.rating?'★'.repeat(x.rating)+'☆'.repeat(5-x.rating):'未评分';let who=document.createElement('span');who.textContent=x.author||'匿名观众';let time=document.createElement('time');if(x.time){time.dateTime=x.time;time.textContent=new Date(x.time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}meta.append(star,who,time);let p=document.createElement('p');p.className='review-content';p.textContent=x.content;card.append(title,meta,p);$('#list').append(card)}$('#message').hidden=data.length>0;$('#message').textContent='暂时没有找到评价。';$('#more').hidden=data.length<=limit}async function load(){try{const r=await fetch(API+'/reviews');if(!r.ok)throw Error();let data=await r.json();for(const x of data.reviews)pending.delete(x.id);rows=[...pending.values(),...data.reviews];render()}catch{$('#count').textContent='加载失败';$('#message').hidden=false;$('#message').textContent='评价暂时无法加载，请稍后刷新重试。'}}async function loadOptions(){try{let r=await fetch(API+'/options');if(!r.ok)throw Error();let data=await r.json(),select=$('#drama');select.replaceChildren(new Option('请选择剧集',''));for(const name of data.options.filter(x=>x!=='其他'))select.append(new Option(name,name));select.disabled=false;$('#submit').disabled=false;let requested=new URLSearchParams(location.search).get('drama');if(requested&&data.options.includes(requested))select.value=requested}catch{$('#status').textContent='剧集列表暂时无法加载，请稍后刷新重试。'}}$('#filter').addEventListener('input',()=>{limit=20;render()});$('#more').addEventListener('click',()=>{limit+=20;render()});$('#form').addEventListener('submit',async e=>{e.preventDefault();let token=window.turnstile?.getResponse();if(!token){$('#status').textContent='请先完成人机验证。';return}$('#submit').disabled=true;$('#status').textContent='正在提交…';try{let res=await fetch(API+'/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({drama:$('#drama').value,rating:Number($('#rating').value),content:$('#content').value,token})});let data=await res.json();if(!res.ok)throw Error(data.error||'提交失败');pending.set(data.review.id,data.review);$('#content').value='';$('#rating').value='';$('#status').textContent='提交成功，感谢分享！';await load()}catch(err){$('#status').textContent=err.message||'提交失败，请稍后重试。'}finally{window.turnstile?.reset();$('#submit').disabled=false}});loadOptions();load();setInterval(load,30000);
</script></body></html>
