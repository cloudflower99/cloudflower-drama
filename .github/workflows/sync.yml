name: Sync from Notion and publish
on:
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: '强制刷新某个日期页（页 ID）或 home'
        required: false
        type: string
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previous sync cache
        uses: actions/cache@v4
        with:
          path: |
            .sync-cache
            site/covers
          key: notion-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            notion-site-v1-
      - name: Refresh changed content only
        env:
          REFRESH_SCOPE: ${{ inputs.refresh_scope }}
        run: |
          python - <<'PYCODE'
          import json, os, pathlib
          p = pathlib.Path('.sync-cache/manifest.json')
          scope = os.environ.get('REFRESH_SCOPE', '').strip()
          if p.is_file() and scope:
              data = json.loads(p.read_text(encoding='utf-8'))
              if scope == 'home':
                  data['home_groups'] = {}
              else:
                  clean = scope.replace('-', '').lower()
                  if len(clean) != 32 or any(c not in '0123456789abcdef' for c in clean):
                      raise SystemExit('Invalid page ID')
                  pages = data.get('pages', {})
                  for key in list(pages):
                      if key.replace('-', '').lower() == clean:
                          del pages[key]
              p.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
              print('Invalidated selected cache scope')
          PYCODE
      - name: Build from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_new.py
      - name: Install image optimizer
        run: python -m pip install Pillow==11.3.0
      - name: Optimize poster covers
        run: python optimize_covers.py
      - name: Embed catalog for fast first display
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          data = json.loads(Path('site/data.json').read_text(encoding='utf-8'))
          if not isinstance(data.get('items'), list) or not data.get('generated'):
              raise SystemExit('Invalid catalog')
          payload = json.dumps(data, ensure_ascii=False, separators=(',', ':')).replace('<', r'\u003c').replace('>', r'\u003e').replace('&', r'\u0026')
          page = Path('site/index.html')
          html = page.read_text(encoding='utf-8')
          # Render the newest date into HTML so cards paint before JavaScript loads.
          import html as html_lib, re
          from urllib.parse import urlencode, urlsplit
          esc = lambda value: html_lib.escape(str(value or ''), quote=True)
          def scheme(value):
              try: return urlsplit(str(value)).scheme
              except ValueError: return 'invalid'
          dates = sorted({str(x.get('date') or 'undated') for x in data['items']} - {'undated'}, reverse=True)
          if any(not x.get('date') for x in data['items']):
              dates.append('undated')
          selected = dates[0] if dates else 'all'
          visible = [x for x in data['items'] if selected == 'all' or (x.get('date') or 'undated') == selected]
          options = '<option value="all">全部日期</option>' + ''.join('<option value="' + esc(d) + '"' + (' selected' if d == selected else '') + '>' + ('日期未注明' if d == 'undated' else esc(d)) + '</option>' for d in dates)
          cards = []
          for i, x in enumerate(visible[:18]):
              title = str(x.get('title') or '')
              chinese = list(re.finditer(r'[\u3400-\u9fff]', title))
              main, english = title, ''
              if chinese:
                  last = chinese[-1].end()
                  boundary = re.search(r'\s+(?=[A-Za-z])', title[last:])
                  if boundary:
                      cut = last + boundary.start()
                      main, english = title[:cut].strip(), title[cut:].strip()
              href = 'drama.html?' + urlencode({'title': title})
              image = str(x.get('thumbnail') or x.get('image') or '')
              image_scheme = scheme(image)
              if image and (image_scheme == 'https' or (not image_scheme and not image.startswith('//'))):
                  cover = '<img src="' + esc(image) + '" alt="' + esc(title + ' 海报') + '" decoding="async" loading="' + ('eager' if i < 2 else 'lazy') + '"' + (' fetchpriority="high"' if i == 0 else '') + ' onload="this.parentElement.classList.toggle(&quot;portrait&quot;,this.naturalHeight>this.naturalWidth)">'
              else:
                  cover = '<span class="poster-empty">☁ 暂无海报</span>'
              links = []
              for name, dest in (x.get('links') or {}).items():
                  if scheme(dest) == 'https':
                      links.append('<a href="' + esc(dest) + '" target="_blank" rel="noopener noreferrer">' + esc(name) + ' ↗</a>')
              summary = re.sub(r'\s+', ' ', str(x.get('description') or '暂无简介')).strip()
              cards.append('<article class="card"><a class="poster-link" href="' + esc(href) + '" aria-label="' + esc('查看 ' + title + ' 的详情和评价') + '"><div class="cover">' + cover + '</div></a><div class="cardbody"><p class="date">' + esc(x.get('date') or '日期未注明') + '</p><h3><a class="drama-title-link" href="' + esc(href) + '"><span class="title-main">' + esc(main) + '</span><span class="title-en">' + esc(english) + '</span></a></h3><p class="card-summary">' + esc(summary) + '</p>' + ('<div class="card-links">' + ''.join(links) + '</div>' if links else '') + '</div></article>')
          def replace_once(old, new):
              global html
              if html.count(old) != 1:
                  raise SystemExit('Missing unique homepage placeholder')
              html = html.replace(old, new, 1)
          replace_once('<select id="date-filter"><option value="all">全部日期</option></select>', '<select id="date-filter">' + options + '</select>')
          replace_once('id="count" aria-live="polite">正在加载…</p>', 'id="count" aria-live="polite">' + str(len(visible)) + ' 部剧集</p>')
          layout = "<script>try{document.currentScript.parentElement.dataset.view=localStorage.getItem('cloudflower-catalog-view-v1')||(matchMedia('(max-width:600px)').matches?'list':'grid')}catch{document.currentScript.parentElement.dataset.view=matchMedia('(max-width:600px)').matches?'list':'grid'}</script>"
          replace_once('<div id="grid" class="grid"></div>', '<div id="grid" class="grid">' + layout + ''.join(cards) + '</div>')
          if html.count('</body>') != 1:
              raise SystemExit('Expected exactly one body closing tag')
          html = html.replace('</body>', '<script type="application/json" id="catalog-bootstrap">' + payload + '</script></body>')
          page.write_text(html, encoding='utf-8')
          page = Path('site/drama.html')
          html = page.read_text(encoding='utf-8')
          marker = "<script>\n'use strict';const API="
          if html.count(marker) != 1:
              raise SystemExit('Expected exactly one detail script')
          html = html.replace(marker, '<script type="application/json" id="catalog-bootstrap">' + payload + '</script>' + marker, 1)
          page.write_text(html, encoding='utf-8')
          PYCODE
      - name: Prevent search indexing of HTML pages
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import re
          pages = list(Path('site').rglob('*.html'))
          if not pages:
              raise SystemExit('No HTML pages found')
          for page in pages:
              text = page.read_text(encoding='utf-8')
              tag = '<meta name="robots" content="noindex, nofollow">'
              text, count = re.subn(r'(?i)(<head(?:\s[^>]*)?>)', lambda m: m.group(1) + '\n' + tag, text, count=1)
              if count != 1:
                  raise SystemExit(f'Missing head element: {page}')
              page.write_text(text, encoding='utf-8')
              print(f'Added noindex: {page}')
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # Artifact visibility can lag behind the upload confirmation.
      - name: Wait for artifact availability
        run: sleep 20
      - name: Publish
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait before retrying publication
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry publication
        if: steps.deployment.outcome == 'failure'
        id: retry_deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
