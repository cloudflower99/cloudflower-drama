name: Sync from Notion and publish
on:
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: '强制刷新某个日期页（页 ID）或 home'
        required: false
        type: string
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previous sync cache
        uses: actions/cache@v4
        with:
          path: |
            .sync-cache
            site/covers
          key: notion-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            notion-site-v1-
      - name: Refresh changed content only
        env:
          REFRESH_SCOPE: ${{ inputs.refresh_scope }}
        run: |
          python - <<'PYCODE'
          import json, os, pathlib
          p = pathlib.Path('.sync-cache/manifest.json')
          scope = os.environ.get('REFRESH_SCOPE', '').strip()
          if p.is_file() and scope:
              data = json.loads(p.read_text(encoding='utf-8'))
              if scope == 'home':
                  data['home_groups'] = {}
              else:
                  clean = scope.replace('-', '').lower()
                  if len(clean) != 32 or any(c not in '0123456789abcdef' for c in clean):
                      raise SystemExit('Invalid page ID')
                  pages = data.get('pages', {})
                  for key in list(pages):
                      if key.replace('-', '').lower() == clean:
                          del pages[key]
              p.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
              print('Invalidated selected cache scope')
          PYCODE
      - name: Build from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_new.py
      - name: Install image optimizer
        run: python -m pip install Pillow==11.3.0
      - name: Optimize poster covers
        run: python optimize_covers.py
      - name: Embed catalog for fast first display
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          data = json.loads(Path('site/data.json').read_text(encoding='utf-8'))
          if not isinstance(data.get('items'), list) or not data.get('generated'):
              raise SystemExit('Invalid catalog')
          payload = json.dumps(data, ensure_ascii=False, separators=(',', ':')).replace('<', r'\u003c').replace('>', r'\u003e').replace('&', r'\u0026')
          page = Path('site/index.html')
          html = page.read_text(encoding='utf-8')
          # Render the newest date into HTML so cards paint before JavaScript loads.
          import html as html_lib, re
          from urllib.parse import urlencode, urlsplit
          esc = lambda value: html_lib.escape(str(value or ''), quote=True)
          def scheme(value):
              try: return urlsplit(str(value)).scheme
              except ValueError: return 'invalid'
          dates = sorted({str(x.get('date') or 'undated') for x in data['items']} - {'undated'}, reverse=True)
          if any(not x.get('date') for x in data['items']):
              dates.append('undated')
          selected = dates[0] if dates else 'all'
          visible = [x for x in data['items'] if selected == 'all' or (x.get('date') or 'undated') == selected]
          options = '<option value="all">全部日期</option>' + ''.join('<option value="' + esc(d) + '"' + (' selected' if d == selected else '') + '>' + ('日期未注明' if d == 'undated' else esc(d)) + '</option>' for d in dates)
          # Public review snapshots are optional; failure must not block publishing.
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor
          import unicodedata
          def public_json(path):
              req = Request('https://api.cloudofflower.ccwu.cc/' + path, headers={'User-Agent': 'cloudflower-site-build'})
              with urlopen(req, timeout=6) as response:
                  body = response.read(8 * 1024 * 1024 + 1)
              if len(body) > 8 * 1024 * 1024: raise ValueError('response too large')
              return json.loads(body)
          def normalized(value):
              return ''.join(c for c in unicodedata.normalize('NFKC', str(value)).lower() if not c.isspace() and unicodedata.category(c)[0] not in ('P', 'S'))
          previews = {}
          try:
              with ThreadPoolExecutor(max_workers=2) as pool:
                  future_options = pool.submit(public_json, 'options')
                  future_reviews = pool.submit(public_json, 'reviews')
                  option_data, review_data = future_options.result(), future_reviews.result()
              if not isinstance(option_data.get('options'), list) or not isinstance(review_data.get('reviews'), list) or not review_data.get('ready') or review_data.get('stale'):
                  raise ValueError('review snapshot unavailable')
              name_index = {}
              for name in option_data['options']:
                  if isinstance(name, str): name_index.setdefault(normalized(name), []).append(name)
              groups = {}
              for row in review_data['reviews']:
                  if isinstance(row, dict) and isinstance(row.get('drama'), str): groups.setdefault(row['drama'], []).append(row)
              for item in visible[:18]:
                  title = str(item.get('title') or '')
                  matches = name_index.get(normalized(title), [])
                  if len(matches) != 1: continue
                  option = matches[0]
                  rows = sorted(groups.get(option, []), key=lambda r: str(r.get('time') or ''), reverse=True)
                  ratings = [r['rating'] for r in rows if type(r.get('rating')) in (int, float) and 1 <= r['rating'] <= 5]
                  latest = [{k: r.get(k) for k in ('id','author','content','rating','time')} for r in rows if isinstance(r.get('content'), str) and r['content'].strip()][:3]
                  previews[title] = {'option': option, 'reviews': latest, 'hasReviews': bool(rows), 'count': len(ratings), 'score': sum(ratings) / len(ratings) if ratings else None, 'average': format(sum(ratings) / len(ratings), '.1f') if ratings else None}
          except Exception as exc:
              previews = {}
              print('Review preview skipped:', type(exc).__name__)
          cards = []
          for i, x in enumerate(visible[:18]):
              title = str(x.get('title') or '')
              chinese = list(re.finditer(r'[\u3400-\u9fff]', title))
              main, english = title, ''
              if chinese:
                  last = chinese[-1].end()
                  boundary = re.search(r'\s+(?=[A-Za-z])', title[last:])
                  if boundary:
                      cut = last + boundary.start()
                      main, english = title[:cut].strip(), title[cut:].strip()
              href = 'drama.html?' + urlencode({'title': title})
              image = str(x.get('thumbnail') or x.get('image') or '')
              image_scheme = scheme(image)
              if image and (image_scheme == 'https' or (not image_scheme and not image.startswith('//'))):
                  cover = '<img src="' + esc(image) + '" alt="' + esc(title + ' 海报') + '" decoding="async" loading="' + ('eager' if i < 2 else 'lazy') + '"' + (' fetchpriority="high"' if i == 0 else '') + ' onload="this.parentElement.classList.toggle(&quot;portrait&quot;,this.naturalHeight>this.naturalWidth)">'
              else:
                  cover = '<span class="poster-empty">☁ 暂无海报</span>'
              links = []
              for name, dest in (x.get('links') or {}).items():
                  if scheme(dest) == 'https':
                      links.append('<a href="' + esc(dest) + '" target="_blank" rel="noopener noreferrer">' + esc(name) + ' ↗</a>')
              review = previews.get(title)
              review_html = stats_html = ''
              if review:
                  review_url = 'drama.html?' + urlencode({'title': title, 'drama': review['option']})
                  score = ('★ ' + review['average'] + ' / 5 · ' + str(review['count']) + ' 条评分') if review['average'] else '☆ 暂无评分'
                  stats_html = '<div class="card-stats"><p class="rating rating-live">' + esc(score) + '</p></div>'
                  snippets = []
                  for r in review['reviews']:
                      rating = r.get('rating')
                      stars = '★' * int(rating) + '☆' * (5 - int(rating)) if type(rating) in (int,float) and 1 <= rating <= 5 else ''
                      content = r['content'].strip()
                      if len(content) > 120: content = content[:120] + '…'
                      snippets.append('<div class="review-snippet"><div class="review-meta"><span class="review-author">' + esc(r.get('author') or '匿名观众') + '</span>' + ('<span class="review-stars">' + stars + '</span>' if stars else '') + '</div><p class="review-text">' + esc(content) + '</p></div>')
                  label = '查看全部评价 ↗' if review['hasReviews'] else '写第一条评价 ↗'
                  review_html = '<section class="card-reviews" aria-label="本剧最新评价"><div class="review-head"><strong>💬 最新短评 · 快照</strong><a class="review-link" href="' + esc(review_url) + '">' + label + '</a></div>' + (''.join(snippets) if snippets else '<p class="review-empty">还没有短评，欢迎分享你的感受。</p>') + '</section>'
              summary = re.sub(r'\s+', ' ', str(x.get('description') or '暂无简介')).strip()
              cards.append('<article class="card"><a class="poster-link" href="' + esc(href) + '" aria-label="' + esc('查看 ' + title + ' 的详情和评价') + '"><div class="cover">' + cover + '</div></a><div class="cardbody"><p class="date">' + esc(x.get('date') or '日期未注明') + '</p><h3><a class="drama-title-link" href="' + esc(href) + '"><span class="title-main">' + esc(main) + '</span><span class="title-en">' + esc(english) + '</span></a></h3><p class="card-summary">' + esc(summary) + '</p>' + stats_html + ('<div class="card-links">' + ''.join(links) + '</div>' if links else '') + review_html + '</div></article>')
          def replace_once(old, new):
              global html
              if html.count(old) != 1:
                  raise SystemExit('Missing unique homepage placeholder')
              html = html.replace(old, new, 1)
          replace_once('<select id="date-filter"><option value="all">全部日期</option></select>', '<select id="date-filter">' + options + '</select>')
          replace_once('id="count" aria-live="polite">正在加载…</p>', 'id="count" aria-live="polite">' + str(len(visible)) + ' 部剧集</p>')
          layout = "<script>try{document.currentScript.parentElement.dataset.view=localStorage.getItem('cloudflower-catalog-view-v1')||(matchMedia('(max-width:600px)').matches?'list':'grid')}catch{document.currentScript.parentElement.dataset.view=matchMedia('(max-width:600px)').matches?'list':'grid'}</script>"
          replace_once('<div id="grid" class="grid"></div>', '<div id="grid" class="grid">' + layout + ''.join(cards) + '</div>')
          if html.count('</body>') != 1:
              raise SystemExit('Expected exactly one body closing tag')
          review_payload = json.dumps(previews, ensure_ascii=False, separators=(',', ':')).replace('<', r'\u003c').replace('>', r'\u003e').replace('&', r'\u0026')
          html = html.replace('</head>', '<link rel="preconnect" href="https://api.cloudofflower.ccwu.cc" crossorigin></head>', 1)
          html = html.replace('</body>', '<script type="application/json" id="catalog-bootstrap">' + payload + '</script><script type="application/json" id="review-bootstrap">' + review_payload + '</script></body>')
          page.write_text(html, encoding='utf-8')
          page = Path('site/drama.html')
          html = page.read_text(encoding='utf-8')
          marker = "<script>\n'use strict';const API="
          if html.count(marker) != 1:
              raise SystemExit('Expected exactly one detail script')
          html = html.replace(marker, '<script type="application/json" id="catalog-bootstrap">' + payload + '</script>' + marker, 1)
          page.write_text(html, encoding='utf-8')
          PYCODE
      - name: Prevent search indexing of HTML pages
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import re
          pages = list(Path('site').rglob('*.html'))
          if not pages:
              raise SystemExit('No HTML pages found')
          for page in pages:
              text = page.read_text(encoding='utf-8')
              tag = '<meta name="robots" content="noindex, nofollow">'
              text, count = re.subn(r'(?i)(<head(?:\s[^>]*)?>)', lambda m: m.group(1) + '\n' + tag, text, count=1)
              if count != 1:
                  raise SystemExit(f'Missing head element: {page}')
              page.write_text(text, encoding='utf-8')
              print(f'Added noindex: {page}')
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # Artifact visibility can lag behind the upload confirmation.
      - name: Wait for artifact availability
        run: sleep 20
      - name: Publish
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait before retrying publication
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry publication
        if: steps.deployment.outcome == 'failure'
        id: retry_deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
