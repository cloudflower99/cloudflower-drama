name: Sync from Notion and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previous sync cache
        uses: actions/cache@v4
        with:
          path: |
            .sync-cache
            site/covers
          key: notion-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            notion-site-v1-
      - name: Build from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_new.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
